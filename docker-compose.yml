version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: simplecoffee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplecoffee"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend/
    command: >
      sh -c "sleep 10 &&
             cd backend/ &&
             alembic upgrade head && 
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/simplecoffee
      CORS_ORIGINS: "http://localhost:3000,http://localhost:80,http://frontend:80"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - api
      - frontend

volumes:
  postgres_data: